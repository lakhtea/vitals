"""
One device class or connection type, measured in both evidence windows.
"""
type BreakdownRow {
  baselineP75: Float
  baselineSampleCount: Int!
  currentP75: Float
  currentSampleCount: Int!

  """Display value of the dimension, e.g. MOBILE or FOUR_G."""
  value: String!
}

"""
A health check an application reports, shown at its latest observation.
"""
type Check {
  """The application's own stable identifier, e.g. api-latency-p95."""
  checkId: String!
  detail: String

  """
  Past observations including this one, newest first. `limit` is clamped to 1..200.
  """
  history(limit: Int = 20): [CheckObservation!]!
  name: String!
  observedAt: DateTime!
  status: CheckStatus!
  unit: String

  """The measurement behind the status, if the check has one."""
  value: Float
}

"""
Why a health-check incident was opened: the observation that tripped the detector.
"""
type CheckEvidence {
  checkId: String!

  """How many observations in a row have been at `status`."""
  consecutive: Int!
  detail: String
  name: String!
  observedAt: DateTime!

  """
  The status observed before this one; null for a check's first observation.
  """
  previousStatus: CheckStatus
  status: CheckStatus!
  unit: String
  value: Float
}

"""One result an application reported for a check."""
type CheckObservation {
  detail: String
  observedAt: DateTime!
  status: CheckStatus!
  unit: String

  """The measurement behind the status, if the check has one."""
  value: Float
}

"""What an application reported about one of its checks."""
enum CheckStatus {
  DEGRADED
  FAILING
  OK
}

enum ConnectionType {
  FOUR_G
  SLOW_2G
  THREE_G
  TWO_G
  UNKNOWN
}

"""An ISO 8601 date-time string, e.g. 2026-10-07T12:00:00.000Z."""
scalar DateTime

"""
What one detector run did. Running it again on the same data reports everything as unchanged.
"""
type DetectionResult {
  opened: Int!
  resolved: Int!

  """
  Findings that already had a live incident, plus live incidents still backed by a finding.
  """
  unchanged: Int!
}

enum DeviceClass {
  DESKTOP
  MOBILE
  TABLET
  UNKNOWN
}

"""What a fix revision does to one file."""
enum FileAction {
  ADD
  DELETE
  MODIFY
}

"""
Who wrote a fix revision: an agent proposing it, or a person editing it.
"""
enum FixAuthor {
  AGENT
  HUMAN
}

"""
A person's new after-content for one ADD or MODIFY file of the latest revision.
"""
input FixFileEdit {
  afterContent: String!
  path: String!
}

"""
One file of a proposed change. ADD has no beforeContent; DELETE has no afterContent; MODIFY has both, and they differ. The path is relative to the repository root.
"""
input FixFileInput {
  action: FileAction!
  afterContent: String
  beforeContent: String
  path: String!
}

"""
One immutable version of the change proposed for an incident. An agent submits revision 1; each human edit writes the next.
"""
type FixRevision {
  author: FixAuthor!

  """The commit the before contents were read at."""
  baseSha: String!
  createdAt: DateTime!

  """
  Every file's unified diff, joined in submission order. One statement per revision.
  """
  diff: String!

  """In submission order. One statement per revision."""
  files: [FixRevisionFile!]!
  id: ID!

  """1-based per incident."""
  number: Int!

  """
  True when a REVIEW step that SUCCEEDED started at or after this revision was created.
  """
  reviewed: Boolean!
  summary: String!

  """"owner/name" of the repository the change applies to."""
  targetRepo: String!
}

"""
One file a revision touches, as whole contents; the diff is derived from them.
"""
type FixRevisionFile {
  action: FileAction!

  """Null for a deleted file."""
  afterContent: String

  """Null for an added file."""
  beforeContent: String

  """
  This file as a unified diff with three lines of context, a/ and b/ headers.
  """
  diff: String!

  """Relative to the repository root."""
  path: String!
}

"""
Something the detector decided a human should look at: a vitals regression or a failing health check.
"""
type Incident {
  """The revision pinned when the incident was approved; null otherwise."""
  approvedRevision: FixRevision

  """
  Per device class and connection type, over the two windows frozen in the evidence; null for health-check incidents. Two statements per incident, so ask for it on the detail view, not the list.
  """
  breakdown: IncidentBreakdown

  """Set when `source` is HEALTH_CHECK."""
  checkEvidence: CheckEvidence
  detectedAt: DateTime!

  """
  Every revision of the proposed fix, oldest first; empty when none was proposed. One statement per incident.
  """
  fixRevisions: [FixRevision!]!
  id: ID!

  """
  The revision a person reviews and approves; null when no fix was proposed.
  """
  latestFixRevision: FixRevision

  """The regressed metric; null for a health-check incident."""
  metric: MetricName

  """What the human wrote when approving or dismissing."""
  note: String
  resolvedAt: DateTime
  siteId: ID!
  source: IncidentSource!
  status: IncidentStatus!

  """
  Who did what, oldest first; empty until an agent or a human acts. One statement per incident, so ask for it on the detail view, not the list.
  """
  steps: [IncidentStep!]!

  """The path for a vitals regression, the check id for a health check."""
  subject: String!
  updatedAt: DateTime!

  """Set when `source` is WEB_VITALS."""
  vitalsEvidence: VitalsEvidence
}

type IncidentBreakdown {
  byConnection: [BreakdownRow!]!
  byDevice: [BreakdownRow!]!
}

"""Which detector opened the incident."""
enum IncidentSource {
  HEALTH_CHECK
  WEB_VITALS
}

"""
Where an incident is in its life. Agents walk OPEN through AWAITING_HUMAN; a human APPROVES or DISMISSES; the detector RESOLVES.
"""
enum IncidentStatus {
  APPROVED
  AWAITING_HUMAN
  DISMISSED
  FIX_PROPOSED
  OPEN
  RESOLVED
  REVIEWED
  TRIAGED
}

"""
One entry in an incident's timeline: an agent's work (from M15) or a human decision.
"""
type IncidentStep {
  costUsd: Float

  """The long form: what was seen and concluded, or the human's note."""
  detail: String
  finishedAt: DateTime
  id: ID!
  inputTokens: Int

  """A URL to follow: the PR, a trace, a commit."""
  link: String
  model: String
  outputTokens: Int
  role: StepRole!
  startedAt: DateTime!
  status: StepStatus!

  """One line a human can read in the timeline."""
  summary: String!
}

enum MetricName {
  CLS
  FCP
  INP
  LCP
  TTFB
}

enum MetricRating {
  GOOD
  NEEDS_IMPROVEMENT
  POOR
}

"""One metric's p75 over time."""
type MetricSeries {
  name: MetricName!

  """
  Buckets with at least one sample, oldest first; empty buckets are omitted.
  """
  points: [SeriesPoint!]!
}

"""Percentiles and rating buckets for one metric over a set of pageviews."""
type MetricSummary {
  buckets: RatingBuckets!
  name: MetricName!
  p50: Float!

  """The headline number, per web.dev."""
  p75: Float!
  p75Rating: MetricRating!
  p90: Float!
  sampleCount: Int!
}

type Mutation {
  """
  A human confirms the incident is real and worth fixing. Allowed from any live status; refused once decided or resolved. When the incident has a proposed fix, revisionId is required and must be its latest revision, which the approval pins; when it has none, revisionId must be absent.
  """
  approveIncident(id: ID!, note: String, revisionId: ID): Incident!

  """
  Run the deterministic detector for one site now. Idempotent: a second run on the same data changes nothing.
  """
  detectIncidents(siteId: ID!): DetectionResult!

  """
  A human closes the incident as noise or not worth acting on. Allowed from any live status; refused once decided or resolved.
  """
  dismissIncident(id: ID!, note: String): Incident!

  """
  A person edits the latest revision's new contents; writes a new HUMAN revision (unchanged files copied) and a HUMAN step "Edited the proposed change (revision N)" with the note as detail. Only ADD and MODIFY files can be edited, only the incident's latest revision, only while the incident is live and not approved. Refused when nothing changed.
  """
  editFixRevision(files: [FixFileEdit!]!, note: String, revisionId: ID!): FixRevision!

  """
  An agent appends one step to an incident's timeline. Needs the service token. Refused for role HUMAN (people decide through approveIncident and dismissIncident) and for a dismissed or resolved incident.
  """
  recordStep(
    """The long form, at most 20,000 characters."""
    detail: String

    """Must not be before startedAt."""
    finishedAt: DateTime
    incidentId: ID!

    """An http(s) URL: the PR, a trace, a commit."""
    link: String
    role: StepRole!

    """Defaults to now."""
    startedAt: DateTime
    status: StepStatus!

    """One line, 1 to 300 characters after trimming."""
    summary: String!
    usage: StepUsageInput
  ): IncidentStep!

  """
  An agent proposes a change. Needs the service token. The incident must be live (not dismissed, resolved, or approved).
  """
  submitFixRevision(
    """The commit the before contents were read at."""
    baseSha: String!

    """1 to 20 files, each content at most 200,000 UTF-8 bytes."""
    files: [FixFileInput!]!
    incidentId: ID!
    summary: String!

    """"owner/name" of the repository."""
    targetRepo: String!
  ): FixRevision!

  """
  An agent moves an incident one stage along OPEN -> TRIAGED -> FIX_PROPOSED -> REVIEWED -> AWAITING_HUMAN. Needs the service token. Refused for any other target and for skipping a stage.
  """
  transitionIncident(id: ID!, to: IncidentStatus!): Incident!
}

"""Traffic for one URL path, aggregated over its pageviews."""
type Page {
  """
  p75 per metric per device class and per connection type, for this path. Two statements, so ask for it on the detail view, not the list.
  """
  breakdown(filter: TrafficFilter): PageBreakdown!

  """Metric events recorded on this path."""
  eventCount: Int!

  """
  Per-metric percentiles for this path; pass the same filter you gave `pages`.
  """
  metrics(filter: TrafficFilter): [MetricSummary!]!
  pageviewCount: Int!
  path: String!

  """
  p75 per bucket for every metric on this path; one statement for all five metrics.
  """
  series(bucket: SeriesBucket!, filter: TrafficFilter): [MetricSeries!]!

  """Sessions that visited this path, most recent first."""
  sessions(filter: TrafficFilter, limit: Int = 50): [Session!]!
}

"""
Per device class and per connection type; values with no samples are omitted.
"""
type PageBreakdown {
  byConnection: [PageBreakdownRow!]!
  byDevice: [PageBreakdownRow!]!
}

"""
One device class or connection type and what the page's metrics look like for it.
"""
type PageBreakdownRow {
  """One summary per metric that had samples in this slice."""
  metrics: [MetricSummary!]!

  """DeviceClass or ConnectionType value, e.g. MOBILE or FOUR_G."""
  value: String!
}

"""One navigation within a session."""
type Pageview {
  id: ID!
  path: String!
  startedAt: DateTime!
}

type Query {
  """
  One incident by id, with its evidence and steps; null when no incident has that id.
  """
  incident(id: ID!): Incident
  pages(filter: TrafficFilter, siteId: ID!): [Page!]!
  site(id: ID!): Site
  sites: [Site!]!
}

"""How many samples fell in each web.dev rating band."""
type RatingBuckets {
  good: Int!
  needsImprovement: Int!
  poor: Int!
}

"""How wide each point of a time series is."""
enum SeriesBucket {
  DAY
  HOUR
  SIX_HOURS
}

"""One bucket of a time series."""
type SeriesPoint {
  """Start of the bucket."""
  from: DateTime!
  p75: Float!
  sampleCount: Int!
}

"""One visitor's visit: who they were (coarsely) and when."""
type Session {
  connectionType: ConnectionType!
  deviceClass: DeviceClass!
  id: ID!

  """This session's navigations, in visit order."""
  pageviews: [Pageview!]!
  startedAt: DateTime!
  userAgentFamily: String!
}

"""A property being measured."""
type Site {
  """
  Every check the site's applications have reported, at its latest observation, worst status first.
  """
  checks: [Check!]!
  createdAt: DateTime!
  id: ID!

  """Newest first, at most 100; pass a status to narrow."""
  incidents(status: IncidentStatus): [Incident!]!

  """Site-wide rollup across every path."""
  metrics(filter: TrafficFilter): [MetricSummary!]!
  name: String!

  """
  One page by its exact path, or null when the site has no traffic on it under the filter.
  """
  page(filter: TrafficFilter, path: String!): Page

  """Paths with traffic, most viewed first."""
  pages(filter: TrafficFilter): [Page!]!

  """
  p75 per bucket for every metric, site-wide; one statement for all five metrics.
  """
  series(bucket: SeriesBucket!, filter: TrafficFilter): [MetricSeries!]!

  """Most recent sessions first."""
  sessions(filter: TrafficFilter, limit: Int = 50): [Session!]!
}

"""Who took a step on an incident: one of the agent roles, or the human."""
enum StepRole {
  HUMAN
  OPEN_PR
  PROPOSE_FIX
  REVIEW
  SUMMARIZE
}

enum StepStatus {
  FAILED
  RUNNING
  SUCCEEDED
}

"""
What the model call behind a step cost. Every field is optional; numbers must not be negative.
"""
input StepUsageInput {
  costUsd: Float
  inputTokens: Int
  model: String
  outputTokens: Int
}

"""
Narrow traffic to a half-open time window [from, to) and/or session dimensions. Every field is optional.
"""
input TrafficFilter {
  connectionType: ConnectionType
  deviceClass: DeviceClass
  from: DateTime
  to: DateTime
}

"""
Why a vitals regression was opened: the baseline window against the current one.
"""
type VitalsEvidence {
  baseline: WindowSummary!
  current: WindowSummary!
  metric: MetricName!
  path: String!

  """
  (current.p75 - baseline.p75) / baseline.p75; 0.5 means half again as slow.
  """
  relativeIncrease: Float!
}

"""
One aggregation window, half-open [from, to), summarised to the number web.dev rates: the p75.
"""
type WindowSummary {
  from: DateTime!
  p75: Float!
  rating: MetricRating!
  sampleCount: Int!
  to: DateTime!
}
